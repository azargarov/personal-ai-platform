name: Phase 0 Foundation

on:
  push:
    paths:
      - "modules/phase-0-foundation/**"
      - ".github/workflows/phase0-static.yml"

  pull_request:
    paths:
      - "modules/phase-0-foundation/**"
      - ".github/workflows/phase0-static.yml"

jobs:
  static-checks:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    defaults:
      run:
        working-directory: modules/phase-0-foundation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f README.md
          test -f Makefile
          test -f .env.example
          test -d docs
          test -d scripts

      - name: Check shell syntax
        run: |
          find scripts -name "*.sh" -print0 | xargs -0 -n1 bash -n

      - name: Check required env values
        run: |
          grep -q '^VECTOR_STORE=qdrant' .env.example
          grep -q '^QDRANT_URL=http://qdrant:6333' .env.example